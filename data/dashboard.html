<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>geolocate-anything</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
:root {
  color-scheme: light;
  --surface-0: #eceae4;
  --surface-1: #fcfcfb;
  --surface-2: #f3f2ef;
  --glass: rgba(252, 252, 251, .9);
  --border: #e2e1dc;
  --land: #dddbd4;
  --text-primary: #0b0b0b;
  --text-secondary: #52514e;
  --text-muted: #8a8984;
  --series-1: #2a78d6;
  --series-1-soft: rgba(42, 120, 214, .14);
  --region-other: #b9b8b1;
  --good: #0ca30c; --warning: #e9a206; --serious: #ec835a; --critical: #d03b3b;
  --shadow: 0 8px 30px rgba(0, 0, 0, .10), 0 1px 3px rgba(0, 0, 0, .06);
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --surface-0: #0d0d0c;
    --surface-1: #1a1a19;
    --surface-2: #232321;
    --glass: rgba(26, 26, 25, .9);
    --border: #2e2e2c;
    --land: #262624;
    --text-primary: #f0efec;
    --text-secondary: #c3c2b7;
    --text-muted: #8f8e86;
    --series-1: #3987e5;
    --series-1-soft: rgba(57, 135, 229, .18);
    --region-other: #5b5a55;
    --shadow: 0 8px 30px rgba(0, 0, 0, .45), 0 1px 3px rgba(0, 0, 0, .3);
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; }
body { font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--surface-0); color: var(--text-primary); }
#map { position: fixed; inset: 0; background: var(--surface-0); z-index: 0; }
#map.near path.land { fill-opacity: 0; stroke-opacity: 0; }
#map.near path.region { fill-opacity: .07; stroke-opacity: .5; }
.leaflet-tooltip { font: 12px/1.4 system-ui, sans-serif; }
.leaflet-control-zoom { display: none; }
.hidden { display: none !important; }
svg.i { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }

/* ------------------------------------------------ top bar */
header {
  position: fixed; top: 14px; left: 50%; transform: translateX(-50%); z-index: 1000;
  display: flex; align-items: center; gap: 6px; padding: 5px; border-radius: 999px;
  background: var(--glass); backdrop-filter: blur(12px); box-shadow: var(--shadow); border: 1px solid var(--border);
}
nav { display: flex; gap: 2px; }
nav a {
  display: inline-flex; align-items: center; gap: 6px; padding: 6px 14px; border-radius: 999px;
  color: var(--text-secondary); text-decoration: none; font-size: 13px; font-weight: 500;
}
nav a:hover { color: var(--text-primary); }
nav a.on { background: var(--text-primary); color: var(--surface-1); }
nav a.off { opacity: .38; pointer-events: none; }
nav a .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--series-1); margin-left: -2px; animation: blink 1.2s ease-in-out infinite; }
@keyframes blink { 50% { opacity: .25; } }

/* ------------------------------------------------ panels */
.panel {
  position: fixed; z-index: 900; background: var(--glass); backdrop-filter: blur(14px);
  border: 1px solid var(--border); border-radius: 18px; box-shadow: var(--shadow);
  animation: rise .35s cubic-bezier(.2, .8, .2, 1);
}
@keyframes rise { from { opacity: 0; transform: translateY(12px); } }
.panel.center { top: 50%; left: 50%; transform: translate(-50%, -50%); width: min(440px, calc(100vw - 32px)); padding: 26px; animation-name: pop; }
@keyframes pop { from { opacity: 0; transform: translate(-50%, calc(-50% + 12px)); } }
.panel.side { top: 74px; left: 16px; bottom: 16px; width: 420px; display: flex; flex-direction: column; overflow: hidden; }
.scroll { overflow-y: auto; padding: 0 20px 20px; flex: 1; }

/* ------------------------------------------------ step 1: upload */
#drop {
  display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center;
  border: 2px dashed var(--border); border-radius: 14px; padding: 38px 20px; cursor: pointer;
  transition: border-color .15s, background .15s, transform .15s;
}
#drop:hover, #drop.over { border-color: var(--series-1); background: var(--series-1-soft); }
#drop.over { transform: scale(1.015); }
#drop input { display: none; }
#drop .big { width: 54px; height: 54px; border-radius: 50%; background: var(--series-1-soft); color: var(--series-1); display: grid; place-items: center; }
#drop .big svg { width: 26px; height: 26px; }
#drop strong { font-size: 17px; }
.opts { margin-top: 12px; font-size: 11.5px; color: var(--text-muted); }
.opts .rng-head { display: flex; justify-content: space-between; gap: 8px; margin-bottom: 4px; }
.opts .rng-head b { font-weight: 600; color: var(--text-primary); font-variant-numeric: tabular-nums; }
.rng { position: relative; height: 22px; }
.rng .track, .rng .fill { position: absolute; top: 9px; height: 4px; border-radius: 2px; }
.rng .track { left: 0; right: 0; background: var(--border); }
.rng .fill { background: var(--series-1); }
.rng input { position: absolute; inset: 0; width: 100%; margin: 0; background: none; pointer-events: none; -webkit-appearance: none; appearance: none; }
.rng input::-webkit-slider-thumb { -webkit-appearance: none; pointer-events: auto; width: 16px; height: 16px; border-radius: 50%; background: var(--surface-1); border: 2px solid var(--series-1); cursor: pointer; }
.rng input::-moz-range-thumb { pointer-events: auto; width: 12px; height: 12px; border-radius: 50%; background: var(--surface-1); border: 2px solid var(--series-1); cursor: pointer; }
.rng input::-moz-range-track { background: none; }
.rng input:disabled::-webkit-slider-thumb { display: none; }

/* ------------------------------------------------ step 2: analysing */
.listening { display: flex; flex-direction: column; align-items: center; gap: 16px; padding: 10px 0; text-align: center; }
.wave { display: flex; align-items: center; gap: 4px; height: 56px; }
.wave i { width: 5px; border-radius: 3px; background: var(--series-1); animation: wv 1.1s ease-in-out infinite; }
@keyframes wv { 0%, 100% { height: 18%; opacity: .5; } 50% { height: 100%; opacity: 1; } }
.listening .fname { font-weight: 600; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.listening .stage { color: var(--text-muted); font-size: 13px; min-height: 1.4em; transition: opacity .3s; }
.elapsed { font-variant-numeric: tabular-nums; font-size: 28px; font-weight: 300; letter-spacing: -.02em; }
.err-box { display: flex; gap: 10px; align-items: flex-start; color: var(--critical); background: color-mix(in srgb, var(--critical) 10%, transparent); padding: 10px 12px; border-radius: 10px; margin-top: 14px; font-size: 13px; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px; font: inherit; font-size: 13px; font-weight: 500;
  padding: 7px 14px; border: 1px solid var(--border); border-radius: 999px; background: var(--surface-1);
  color: var(--text-primary); cursor: pointer; white-space: nowrap;
}
.btn:hover:not(:disabled) { border-color: var(--series-1); }
.btn:disabled { color: var(--text-muted); cursor: default; }
.btn.icon { padding: 7px; }
.btn.primary { background: var(--text-primary); color: var(--surface-1); border-color: transparent; }

/* ------------------------------------------------ step 3: result */
.hero { padding: 20px 20px 14px; display: grid; grid-template-columns: auto 1fr auto; gap: 16px; align-items: center; }
.ring { position: relative; width: 74px; height: 74px; }
.ring svg { width: 74px; height: 74px; transform: rotate(-90deg); }
.ring circle { fill: none; stroke-width: 7; stroke-linecap: round; }
.ring .track { stroke: var(--border); }
.ring .val { transition: stroke-dashoffset .9s cubic-bezier(.2, .8, .2, 1); }
.ring span { position: absolute; inset: 0; display: grid; place-items: center; font-size: 10px; font-weight: 700; letter-spacing: .06em; }
.hero .where { font-size: 21px; font-weight: 650; letter-spacing: -.015em; line-height: 1.2; }
.hero .flags { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
.cal { display: flex; gap: 12px; align-items: center; margin: 0 20px 14px; padding: 10px 12px; background: var(--surface-2); border-radius: 12px; }
.cal .page { width: 50px; border-radius: 8px; overflow: hidden; text-align: center; background: var(--surface-1); box-shadow: 0 1px 3px rgba(0,0,0,.12); flex: none; }
.cal .page b { display: block; background: var(--critical); color: #fff; font-size: 10px; letter-spacing: .08em; padding: 2px 0; }
.cal .page span { display: block; font-size: 22px; font-weight: 650; padding: 1px 0 3px; }
.cal .clock { font-size: 22px; font-weight: 300; font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
.cal .clock small { font-size: 11px; color: var(--text-muted); font-weight: 500; letter-spacing: .04em; margin-left: 4px; }
.cal .sub { font-size: 12px; color: var(--text-muted); }
.tabs { display: flex; gap: 2px; margin: 0 20px 14px; padding: 3px; background: var(--surface-2); border-radius: 10px; }
.tabs button {
  flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px; padding: 7px 4px; border: 0; border-radius: 8px;
  background: none; color: var(--text-secondary); font: inherit; font-size: 12.5px; font-weight: 500; cursor: pointer;
}
.tabs button.on { background: var(--surface-1); color: var(--text-primary); box-shadow: 0 1px 3px rgba(0,0,0,.1); }
.tab { animation: fade .25s ease; }
@keyframes fade { from { opacity: 0; } }
h3 { font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: var(--text-muted); margin: 18px 0 8px; font-weight: 600; }
h3:first-child { margin-top: 2px; }

.bars .row { display: grid; grid-template-columns: 110px 1fr; gap: 10px; align-items: center; margin: 7px 0; font-size: 12.5px; cursor: default; }
.bars .row .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text-secondary); }
.bars .row.win .name { color: var(--text-primary); font-weight: 600; }
.bars .track { height: 10px; border-radius: 5px; background: var(--surface-2); overflow: hidden; }
.bars .fill { height: 100%; border-radius: 5px; background: var(--region-other); width: 0; transition: width .8s cubic-bezier(.2, .8, .2, 1); }
.bars .row.win .fill { background: var(--series-1); }
.bars .row.empty .track { background: repeating-linear-gradient(45deg, var(--surface-2) 0 4px, transparent 4px 8px); }

.chart { position: relative; }
.chart svg { display: block; width: 100%; overflow: visible; }
.chart .gl line { stroke: var(--border); }
.chart text { fill: var(--text-muted); font-size: 10px; }
.chart .line { fill: none; stroke: var(--series-1); stroke-width: 2; stroke-linejoin: round; }
.chart .area { fill: var(--series-1-soft); stroke: none; }
.chart .cross { stroke: var(--text-muted); stroke-dasharray: 2 2; }
.chart .dot { fill: var(--series-1); stroke: var(--surface-1); stroke-width: 2; }
.chart .cut { stroke: var(--critical); stroke-dasharray: 3 3; opacity: .7; }
.chart .stem { stroke: var(--region-other); stroke-width: 2; }
.chart .stem.win { stroke: var(--series-1); }
.chart .head { fill: var(--region-other); }
.chart .head.win { fill: var(--series-1); }
.tip {
  position: absolute; pointer-events: none; background: var(--surface-1); border: 1px solid var(--border);
  border-radius: 6px; padding: 3px 7px; font-size: 12px; white-space: nowrap; box-shadow: 0 2px 6px rgba(0,0,0,.12);
  font-variant-numeric: tabular-nums; display: none; z-index: 2;
}

.meters { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.meter { background: var(--surface-2); border-radius: 12px; padding: 10px; text-align: center; }
.meter .donut { width: 52px; height: 52px; margin: 0 auto 4px; }
.meter .donut circle { fill: none; stroke-width: 6; }
.meter .v { font-size: 15px; font-weight: 650; font-variant-numeric: tabular-nums; }
.meter .k { font-size: 11px; color: var(--text-muted); }

.strip { position: relative; display: flex; height: 38px; border-radius: 10px; overflow: hidden; gap: 2px; }
.strip button {
  border: 0; padding: 0; cursor: pointer; color: #fff; font: inherit; font-size: 11px; font-weight: 700;
  display: grid; place-items: center; min-width: 14px; transition: filter .15s, transform .15s;
}
.strip button:hover { filter: brightness(1.1); }
.strip button.on { outline: 2px solid var(--text-primary); outline-offset: -2px; }
.axis { display: flex; justify-content: space-between; font-size: 10.5px; color: var(--text-muted); margin-top: 4px; font-variant-numeric: tabular-nums; }
.clip { margin-top: 12px; padding: 12px; background: var(--surface-2); border-radius: 12px; display: flex; gap: 12px; align-items: center; }
.clip .dotlvl { width: 12px; height: 12px; border-radius: 50%; flex: none; }
.clip b { display: block; }
.clip span { font-size: 12px; color: var(--text-muted); font-variant-numeric: tabular-nums; }

.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.tile { background: var(--surface-2); border-radius: 12px; padding: 10px 12px; display: flex; gap: 10px; align-items: center; min-width: 0; }
.tile svg.i { color: var(--text-muted); width: 18px; height: 18px; }
.tile div { min-width: 0; }
.tile b { display: block; font-size: 13px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tile span { font-size: 11px; color: var(--text-muted); }
.tile.wide { grid-column: span 2; }
.notes { list-style: none; margin: 0; padding: 0; }
.notes li { display: flex; gap: 8px; font-size: 12.5px; color: var(--text-secondary); padding: 8px 0; border-top: 1px solid var(--border); }
.notes li:first-child { border-top: 0; }
.notes li svg.i { color: var(--warning); margin-top: 1px; }
.notes li.ok svg.i { color: var(--good); }
details.more summary { cursor: pointer; font-size: 12.5px; color: var(--text-muted); margin-top: 16px; list-style: none; display: flex; align-items: center; gap: 6px; }
details.more summary::-webkit-details-marker { display: none; }
details.more[open] summary svg { transform: rotate(90deg); }

/* ------------------------------------------------ data page */
.data-head { padding: 20px 20px 4px; }
.data-head h2 { margin: 0; font-size: 17px; letter-spacing: -.01em; }
.data-head .sub { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
/* aircraft tab */
.gantt .lane .day { position: absolute; top: 2px; bottom: 2px; min-width: 2px; border-radius: 2px; }
.gantt .tot { font-size: 10.5px; color: var(--text-muted); font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
#adsb-gantt .row { grid-template-columns: 140px 1fr 46px; }
#adsb-gantt .yrs { margin-right: 54px; white-space: nowrap; }
.leaflet-adsb-pane canvas { opacity: .8; }
/* fetch box: an idle call to action, or a live progress card while sources download */
.fetch { margin: 12px 20px 8px; }
.fetch .go {
  width: 100%; display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 14px; cursor: pointer; text-align: left;
  border: 1px solid var(--border); background: var(--surface-2); color: var(--text-primary); font: inherit; transition: border-color .15s, transform .15s;
}
.fetch .go:hover:not(:disabled) { border-color: var(--series-1); transform: translateY(-1px); }
.fetch .go:disabled { opacity: .55; cursor: default; }
.fetch .go .ic { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; background: var(--series-1); color: #fff; flex: none; }
.fetch .go b { display: block; font-size: 13.5px; }
.fetch .go span { font-size: 12px; color: var(--text-muted); }
.fetch-card { padding: 12px 14px 11px; border-radius: 14px; background: var(--surface-2); animation: fade .25s ease; }
.fetch-card .top { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; font-size: 13.5px; }
.fetch-card .top b { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fetch-card .top span { font-size: 12px; color: var(--text-muted); font-variant-numeric: tabular-nums; flex: none; }
.fetch-card .sub { font-size: 11.5px; color: var(--text-muted); margin-top: 6px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fetch-card.ok .pbar i { background: var(--good); animation: none; }
.fetch-card.ok .pbar i::after { display: none; }
.pbar { position: relative; height: 8px; margin-top: 9px; border-radius: 4px; background: var(--border); overflow: hidden; }
.pbar i {
  position: absolute; left: 0; top: 0; bottom: 0; min-width: 6%; border-radius: 4px; transition: width .9s cubic-bezier(.2, .8, .2, 1);
  background: repeating-linear-gradient(-45deg, var(--series-1) 0 8px, color-mix(in srgb, var(--series-1) 72%, #fff) 8px 16px);
  background-size: 22.6px 100%; animation: stripes .7s linear infinite;
}
.pbar i::after {  /* a glint sweeping across the filled part */
  content: ""; position: absolute; inset: 0; border-radius: 4px;
  background: linear-gradient(90deg, transparent, rgba(255, 255, 255, .55), transparent); background-size: 40% 100%; background-repeat: no-repeat;
  animation: glint 1.6s ease-in-out infinite;
}
@keyframes stripes { to { background-position: 22.6px 0; } }
@keyframes glint { from { background-position: -40% 0; } to { background-position: 140% 0; } }
.gantt .yrs { position: relative; height: 16px; margin-left: 148px; margin-right: 38px; font-size: 10px; color: var(--text-muted); }
.gantt .yrs span { position: absolute; transform: translateX(-50%); font-variant-numeric: tabular-nums; }
.gantt .row { display: grid; grid-template-columns: 140px 1fr 30px; gap: 8px; align-items: center; padding: 6px 0; border-radius: 8px; cursor: default; }
.gantt .row:hover { background: var(--surface-2); }
.gantt .row .name { font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: flex; align-items: center; gap: 6px; }
.gantt .hz { font-size: 9.5px; font-weight: 700; color: var(--text-muted); border: 1px solid var(--border); border-radius: 4px; padding: 0 3px; flex: none; }
.gantt .lane { position: relative; height: 14px; border-radius: 7px; background: var(--surface-2); }
.gantt .lane .yr { position: absolute; top: -3px; bottom: -3px; width: 1px; background: var(--border); }
.gantt .bar { position: absolute; top: 2px; bottom: 2px; border-radius: 5px; background: var(--c, var(--series-1)); min-width: 4px; }
.gantt .lane .stale { position: absolute; top: 3px; width: 8px; height: 8px; margin-left: 4px; border-radius: 50%; border: 2px solid var(--text-muted); }
.gantt .bar.busy { background: linear-gradient(90deg, var(--c), color-mix(in srgb, var(--c) 35%, transparent), var(--c)); background-size: 200% 100%; animation: shimmer 1.4s linear infinite; }
.legend .ramp { width: 170px; height: 8px; border-radius: 4px; margin: 4px 0 2px; }
.legend .ramp-k { display: flex; justify-content: space-between; font-size: 11px; color: var(--text-muted); line-height: 1.3; }
.legend .ramp-k span { width: auto; height: auto; border-radius: 0; margin: 0; }
@keyframes shimmer { to { background-position: -200% 0; } }
.gantt .lane .none { position: absolute; inset: 0; border-radius: 7px; background: repeating-linear-gradient(45deg, transparent 0 4px, var(--border) 4px 5px); }
.gantt .act { display: grid; place-items: center; }
.gantt .act button { opacity: 0; transition: opacity .15s; }
.gantt .row:hover .act button, .gantt .act button.err-b { opacity: 1; }
.gantt .lane .sweep { position: absolute; inset: 0; border-radius: 7px; overflow: hidden; pointer-events: none; }
.gantt .lane .sweep::after {
  content: ""; position: absolute; top: 0; bottom: 0; width: 35%; border-radius: 7px;
  background: linear-gradient(90deg, transparent, color-mix(in srgb, var(--series-1) 55%, transparent), transparent);
  animation: sweep 1.3s ease-in-out infinite;
}
@keyframes sweep { from { left: -35%; } to { left: 100%; } }
.gantt .row.queued .name { color: var(--text-muted); }
.gantt .q { width: 7px; height: 7px; border-radius: 50%; background: var(--text-muted); opacity: .5; animation: blink 1.2s ease-in-out infinite; }
.gantt .act button { border: 0; background: none; color: var(--text-muted); cursor: pointer; padding: 4px; border-radius: 6px; display: grid; }
.gantt .act button:hover:not(:disabled) { color: var(--series-1); background: var(--series-1-soft); }
.gantt .act button:disabled { opacity: .35; cursor: default; }
.gantt .act .err { color: var(--critical); }
.keys { display: flex; gap: 14px; flex-wrap: wrap; font-size: 11.5px; color: var(--text-muted); margin-top: 14px; }
.keys i { display: inline-block; width: 14px; height: 8px; border-radius: 3px; vertical-align: 0; margin-right: 5px; }
.status-line { font-size: 12px; color: var(--text-muted); padding: 2px 20px 10px; min-height: 1.4em; }
.status-line.err { color: var(--critical); }

.legend {
  position: fixed; z-index: 800; bottom: 16px; right: 16px; background: var(--glass); backdrop-filter: blur(12px); color: var(--text-primary);
  border: 1px solid var(--border); border-radius: 10px; padding: 7px 11px; font-size: 12px; line-height: 1.8; box-shadow: var(--shadow);
}
.legend span { display: inline-block; width: 10px; height: 10px; border-radius: 50%; vertical-align: -1px; margin-right: 7px; }

/* ------------------------------------------------ aircraft */
.opts .air { display: flex; align-items: center; gap: 6px; margin-top: 10px; }
.opts .air b { font-weight: 600; color: var(--text-primary); font-variant-numeric: tabular-nums; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.opts .air .btn { padding: 3px 10px; font-size: 11.5px; }
.air-sum { display: flex; gap: 10px; align-items: center; padding: 10px 12px; background: var(--surface-2); border-radius: 12px; }
.air-sum .lvl { font-size: 10px; font-weight: 700; letter-spacing: .06em; padding: 3px 7px; border-radius: 6px; color: #fff; flex: none; }
.air-sum b { display: block; font-variant-numeric: tabular-nums; }
.air-sum span { font-size: 12px; color: var(--text-muted); }
.flights { display: grid; gap: 8px; }
.flight { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; padding: 10px 12px; background: var(--surface-2);
  border-radius: 12px; border: 1px solid transparent; cursor: pointer; transition: border-color .15s, transform .15s; }
.flight:hover, .flight.hot { border-color: var(--fc); transform: translateY(-1px); }
.flight .plane { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: var(--fc); color: #fff; }
.flight .plane svg { width: 17px; height: 17px; fill: currentColor; stroke: none; }
.flight b { display: block; font-size: 13.5px; }
.flight .sub { font-size: 11.5px; color: var(--text-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.flight .num { text-align: right; font-size: 12px; font-variant-numeric: tabular-nums; color: var(--text-secondary); line-height: 1.35; }
.spec { position: relative; margin: 6px 0 4px; border-radius: 8px; overflow: hidden; background: #000; }
.spec canvas { display: block; width: 100%; height: 190px; image-rendering: auto; }
.spec svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.spec { cursor: pointer; }
.spec svg .model { fill: none; stroke-width: 1.6; stroke-linejoin: round; stroke-dasharray: 7 5; opacity: .9; }
.spec svg .straight { fill: none; stroke: rgba(255, 255, 255, .75); stroke-width: 1; stroke-dasharray: 1.5 3; }
.spec.bare svg .model, .spec.bare svg .straight { display: none; }
.spec svg text { fill: rgba(255, 255, 255, .8); font-size: 10px; paint-order: stroke; stroke: rgba(0, 0, 0, .6); stroke-width: 2px; }
.spec svg .cross { stroke: rgba(255, 255, 255, .55); stroke-dasharray: 2 2; }
.spec-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; font-size: 12.5px; margin-top: 14px; }
.spec-head b { font-weight: 600; }
.spec-head span { color: var(--text-muted); font-size: 11.5px; font-variant-numeric: tabular-nums; }
.spec-key { display: flex; gap: 12px; font-size: 11px; color: var(--text-muted); }
.spec-key i { display: inline-block; width: 14px; height: 0; border-top: 2px solid; vertical-align: 3px; margin-right: 5px; }
.plane-ic { background: none; border: 0; }
.plane-ic svg { width: 30px; height: 30px; filter: drop-shadow(0 1px 2px rgba(0,0,0,.5)); }
.listener-ic { width: 18px; height: 18px; border-radius: 50%; background: var(--critical); border: 3px solid #fff; box-shadow: 0 0 0 0 rgba(208, 59, 59, .6); animation: ping 1.8s ease-out infinite; }
@keyframes ping { to { box-shadow: 0 0 0 18px rgba(208, 59, 59, 0); } }
.air-pop { font: 12.5px/1.45 system-ui, sans-serif; min-width: 220px; }
.air-pop h4 { margin: 0 0 2px; font-size: 14px; }
.air-pop .sub { color: #777; margin-bottom: 6px; }
.air-pop table { border-collapse: collapse; width: 100%; }
.air-pop td { padding: 1px 0; vertical-align: top; }
.air-pop td:first-child { color: #777; padding-right: 10px; white-space: nowrap; }
.air-pop a { color: #2a78d6; }
@media (max-width: 800px) {
  header { top: 10px; }
    nav a { padding: 6px 12px; }
  .panel.side { top: auto; left: 0; right: 0; bottom: 0; width: auto; height: 62vh; border-radius: 18px 18px 0 0; }
  .legend { bottom: auto; top: 66px; right: 10px; }
  .hero { padding: 16px 16px 12px; }
  .scroll { padding: 0 16px 16px; }
}
</style>
</head>
<body>
<div id="map"></div>

<header>
  <nav>
    <a href="#/data" id="nav-data"><svg class="i" viewBox="0 0 24 24"><ellipse cx="12" cy="5.5" rx="7" ry="2.5"/><path d="M5 5.5v13c0 1.4 3.1 2.5 7 2.5s7-1.1 7-2.5v-13M5 12c0 1.4 3.1 2.5 7 2.5s7-1.1 7-2.5"/></svg>History<i class="dot hidden" id="nav-busy"></i></a>
    <a href="#/" id="nav-locate"><svg class="i" viewBox="0 0 24 24"><path d="M3 12h2l2-6 3 12 3-9 2 6 2-3h4"/></svg>Recording</a>
    <a href="#/result" id="nav-result" class="off"><svg class="i" viewBox="0 0 24 24"><path d="M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>Location</a>
  </nav>
</header>

<!-- step 1: drop a file -->
<section class="panel center hidden" id="v-upload">
  <label id="drop">
    <input type="file" id="file" accept="audio/*,video/*,.wav,.flac,.mp3,.m4a,.aac,.ogg,.opus,.mp4,.mov,.mkv,.webm">
    <div class="big"><svg class="i" viewBox="0 0 24 24"><path d="M3 12h2l2-6 3 12 3-9 2 6 2-3h4"/></svg></div>
    <strong>Drop a recording</strong>
  </label>
  <div class="opts" id="opts">
    <div class="rng-head"><span>Dates (UTC)</span><span><b id="from-txt">–</b> → <b id="to-txt">–</b></span></div>
    <div class="rng"><div class="track"></div><div class="fill" id="rng-fill"></div>
      <input type="range" id="r-from" min="0" max="0" value="0" step="1" aria-label="From date (UTC)" disabled>
      <input type="range" id="r-to" min="0" max="0" value="0" step="1" aria-label="To date (UTC)" disabled></div>
    <input type="hidden" id="from"><input type="hidden" id="to">
    <div class="air" title="Where to look for the aircraft heard in the recording when the hum gives no grid: the map's current view">
      <span>Aircraft area</span><b id="air-area">from the hum</b>
      <button class="btn" id="air-use" type="button">Use map view</button><button class="btn hidden" id="air-clear" type="button">×</button>
    </div>
  </div>
  <div class="err-box hidden" id="upload-err"></div>
</section>

<!-- step 2: analysing -->
<section class="panel center hidden" id="v-busy">
  <div class="listening">
    <div class="wave" id="wave"></div>
    <div class="fname" id="busy-name"></div>
    <div class="elapsed" id="busy-time">0 s</div>
    <div class="stage" id="busy-stage"></div>
    <button class="btn" id="cancel">Cancel</button>
  </div>
</section>

<!-- step 3: result -->
<section class="panel side hidden" id="v-result">
  <div class="hero">
    <div class="ring" id="ring"></div>
    <div><div class="where" id="where"></div><div class="flags" id="flags"></div></div>
    <a class="btn icon" href="#/" title="Locate another file"><svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></a>
  </div>
  <div class="cal" id="cal"></div>
  <div class="tabs" id="tabs"></div>
  <div class="scroll" id="tab-body"></div>
</section>

<!-- reference data -->
<section class="panel side hidden" id="v-data">
  <div class="data-head">
    <h2>Reference history</h2>
    <div class="sub" id="data-sum"></div>
    <div class="sub hidden" id="adsb-sum" title="How much aircraft (ADS-B) history is stored per 0.5° cell, for the aircraft search">loading…</div>
  </div>
  <div class="tabs" id="data-tabs" style="margin-top:12px"><button type="button" data-tab="grids">Grids</button><button type="button" data-tab="aircraft">Aircraft</button></div>
  <div class="tab-air hidden" id="data-air">
    <div class="fetch" id="adsb-fetch"></div>
    <div class="status-line" id="adsb-status"></div>
    <div class="scroll"><div class="gantt" id="adsb-gantt"></div>
      <div class="keys"><span><i style="background:linear-gradient(90deg,hsl(4 68% 47%),hsl(68 68% 47%),hsl(132 68% 47%))"></i>aircraft-minutes that day, vs the region's busiest day</span><span><i style="background:var(--surface-2);border:1px solid var(--border)"></i>day not stored</span></div>
    </div>
  </div>
  <div class="tab-grids" id="data-grids" style="display:contents">
  <div class="fetch" id="fetch"></div>
  <div class="status-line" id="data-status"></div>
  <div class="scroll"><div class="gantt" id="gantt"></div>
    <div class="keys"><span><i style="background:linear-gradient(90deg,hsl(4 68% 47%) 0 50%,hsl(68 68% 47%) 80%,hsl(132 68% 47%))"></i>share of each month's seconds stored</span><span><i style="width:8px;height:8px;border-radius:50%;border:2px solid var(--text-muted)"></i>behind &gt; 1 week</span><span><i style="background:repeating-linear-gradient(45deg,transparent 0 3px,var(--text-muted) 3px 4px)"></i>none</span></div>
  </div>
  </div>
</section>

<div class="legend hidden" id="legend"></div>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const css = (v) => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const ICON = {
  clock: '<circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/>',
  wave: '<path d="M3 12h2l2-6 3 12 3-9 2 6 2-3h4"/>',
  file: '<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/>',
  pin: '<path d="M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/>',
  cal: '<rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/>',
  device: '<rect x="7" y="3" width="10" height="18" rx="2"/><path d="M11 18h2"/>',
  gauge: '<path d="M4 16a8 8 0 1 1 16 0"/><path d="M12 16l4-5"/>',
  warn: '<path d="M12 4l9 16H3z"/><path d="M12 10v4M12 17.5v.01"/>',
  check: '<circle cx="12" cy="12" r="8.5"/><path d="M8 12.5l2.5 2.5L16 9.5"/>',
  chev: '<path d="M9 6l6 6-6 6"/>',
  target: '<circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4"/><circle cx="12" cy="12" r=".5"/>',
  layers: '<path d="M12 4l9 5-9 5-9-5z"/><path d="M3 14l9 5 9-5"/>',
  refresh: '<path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"/>',
  download: '<path d="M12 4v11M7 10l5 5 5-5M5 20h14"/>',
  info: '<circle cx="12" cy="12" r="8.5"/><path d="M12 11v5M12 8v.01"/>',
  plane: '<path d="M10.2 21l1.8-1.3 1.8 1.3v-1.9l-1.3-1.1v-4.6l7.3 3v-2l-7.3-4.9V4.1c0-.9-.4-1.6-.5-1.6s-.5.7-.5 1.6v5.4L4.2 14.4v2l7.3-3v4.6l-1.3 1.1z"/>',
};
const icon = (k) => `<svg class="i" viewBox="0 0 24 24">${ICON[k]}</svg>`;

// ---------------------------------------------------------------- map
const map = L.map("map", { worldCopyJump: true, zoomSnap: 0.25, zoomControl: false, minZoom: 1, maxZoom: 16 }).setView([30, 10], 2.5);
map.attributionControl.addAttribution("Borders: Natural Earth");
// Street-level basemap once zoomed in (aircraft results): the coarse borders and the grid
// fills fade out so the coast, roads and towns show.
const DARK = matchMedia("(prefers-color-scheme: dark)").matches;
L.tileLayer(`https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_${DARK ? "Dark" : "Light"}_Gray_Base/MapServer/tile/{z}/{y}/{x}`, {
  minZoom: 7, maxZoom: 16, attribution: "Basemap: Esri, HERE, Garmin, © OpenStreetMap contributors",
}).addTo(map);
const nearZoom = () => $("map").classList.toggle("near", map.getZoom() >= 7);
map.on("zoomend", nearZoom);
let countries = null, regionLayer = null, pin = null, airLayer = null, adsbLayer = null, GRIDS = [];
const countriesReady = fetch(
  "https://raw.githubusercontent.com/nvkelso/natural-earth-vector/master/geojson/ne_110m_admin_0_countries.geojson"
).then((r) => r.json()).then((g) => {
  countries = g.features;
  L.geoJSON(countries, { style: { color: css("--surface-0"), weight: 0.8, fillColor: css("--land"), fillOpacity: 1, className: "land" }, interactive: false }).addTo(map);
}).catch(() => { countries = []; });

// Each grid's own outline (not its countries' borders): one feature per dated area,
// {grid, from, to, status}. A grid's extent on a day is its areas active that day.
let AREAS = null;
// The same areas cut along time-zone borders, {grid, from, to, tz, countries, subdivisions, km2}:
// fetched the first time a result narrows the grid by the device clock's UTC offset.
let TZ_AREAS = null, tzLayer = null;
const tzAreas = () => TZ_AREAS ? Promise.resolve(TZ_AREAS)
  : fetch("api/tz-areas").then((r) => r.json()).then((g) => (TZ_AREAS = g.features)).catch(() => (TZ_AREAS = []));
function clearMarks() {
  if (pin) { pin.remove(); pin = null; }
  if (airLayer) { airLayer.remove(); airLayer = null; }
  if (adsbLayer) { adsbLayer.remove(); adsbLayer = null; }
  if (tzLayer) { tzLayer.remove(); tzLayer = null; }
}
const areasReady = fetch("api/grid-areas").then((r) => r.json()).then((g) => { AREAS = g.features; }).catch(() => { AREAS = []; });
const fid = (f) => f.properties.grid || f.properties.id;
const today = () => new Date().toISOString().slice(0, 10);
const activeOn = (f, day) => (!f.properties.from || f.properties.from <= day) && (!f.properties.to || day < f.properties.to);
const STATUS = { synchronous: "AC-synchronous", dc_linked: "DC-linked only", isolated: "isolated" };
const untracked = (id) => GRIDS.find((x) => x.id === id)?.tracked === false;

/* role(gridId) -> "win" | "other" | null decides the fill; fillOf(gridId), when given, colours each grid instead.
   day (YYYY-MM-DD) picks the grids' extent as of that date: today unless a match says otherwise. */
function drawRegions(role, fillOf = null, tipOf = null, day = today()) {
  if (!AREAS) return;
  if (regionLayer) regionLayer.remove();
  const blue = css("--series-1"), grey = css("--region-other"), edge = css("--surface-0");
  const bounds = L.latLngBounds([]);
  regionLayer = L.geoJSON(AREAS, {
    filter: (f) => activeOn(f, day) && role(fid(f)),
    style: (f) => {
      const id = fid(f), win = role(id) === "win";
      return { color: edge, weight: 1, fillOpacity: fillOf ? 0.9 : win ? 0.85 : 0.75, fillColor: fillOf ? fillOf(id) : win ? blue : grey, className: "region" };
    },
    onEachFeature: (f, layer) => {
      const id = fid(f);
      if (role(id) === "win") bounds.extend(layer.getBounds());
      const g = GRIDS.find((x) => x.id === id);
      const st = STATUS[f.properties.status] ? ` · ${STATUS[f.properties.status]}` : "";
      const span = f.properties.from || f.properties.to ? `<br><span style="opacity:.75">${esc(f.properties.from || "…")} → ${esc(f.properties.to || "today")}</span>` : "";
      const base = g ? `<br>${g.nominal_hz} Hz${st} · ${g.tracked === false ? "no public reference data" : `${esc(covText(g.covered_s))} of history`}` : "";
      layer.bindTooltip(`<b>${esc(gridName(id))}</b>${tipOf ? `<br>${tipOf(id)}` : base}${span}`, { sticky: true });
    },
  }).addTo(map);
  return bounds;
}
function legend(items) {
  $("legend").innerHTML = items.map(([c, t]) => `<div><span style="background:${c}"></span>${esc(t)}</div>`).join("");
  $("legend").classList.toggle("hidden", !items.length);
}

// How much reference history a grid has, linearly: 0 at one day (red) .. 1 at the best-covered grid (green).
const DAY = 86400;
const covFrac = (g) => {
  const most = Math.max(2 * DAY, ...GRIDS.map((x) => x.covered_s || 0));
  return Math.min(1, Math.max(0, ((g?.covered_s || 0) - DAY) / (most - DAY)));
};
const covColor = (f) => `hsl(${Math.round(4 + f * 128)} 68% 47%)`;  // red -> amber -> green
// A month's fill on a steep ramp: only near-complete months look green (80% amber, 50% red-orange).
const fillColor = (f) => covColor(f ** 3);
const covText = (s) => !s ? "none" : s < 60 * DAY ? `${Math.round(s / DAY)} days` : s < 730 * DAY ? `${Math.round(s / (30.4 * DAY))} months` : `${(s / (365.25 * DAY)).toFixed(1)} years`;
// Leave room for the side panel when framing the map.
const fitPad = () => innerWidth > 800 ? { paddingTopLeft: [460, 80], paddingBottomRight: [40, 40] } : { paddingTopLeft: [20, 70], paddingBottomRight: [20, innerHeight * 0.62] };
function frame(bounds) { if (bounds && bounds.isValid()) map.flyToBounds(bounds, { ...fitPad(), maxZoom: 5, duration: 0.9 }); }

// ---------------------------------------------------------------- router
let REPORT = null;
function route() {
  const v = location.hash.replace(/^#\/?/, "") || "upload";
  const view = v === "result" && !REPORT ? "upload" : v === "data" ? "data" : v === "result" ? "result" : BUSY ? "busy" : "upload";
  for (const id of ["upload", "busy", "result", "data"]) $("v-" + id).classList.toggle("hidden", id !== view);
  $("nav-data").classList.toggle("on", view === "data");
  $("nav-locate").classList.toggle("on", view === "upload" || view === "busy");
  $("nav-result").classList.toggle("on", view === "result");
  $("nav-result").classList.toggle("off", !REPORT);
  if (view === "data") { renderGantt(); showCoverage(); }
  else if (view === "result") showResultMap();
  else showIdle();
}
addEventListener("hashchange", route);

function showIdle() {
  clearMarks();
  const have = new Set(GRIDS.filter((g) => g.refs_from).map((g) => g.id));
  drawRegions((id) => (have.has(id) ? "win" : "other"));
  legend([[css("--series-1"), "Searchable grids"], [css("--region-other"), "Separate grid, no reference data"]]);
  map.flyTo([30, 10], innerWidth > 800 ? 2.5 : 1.5, { duration: 0.8 });
}
// Data page map: every grid's area coloured by how much history is stored for it.
function showCoverage(fly = true) {
  clearMarks();
  if (DATA_TAB === "aircraft") {
    if (regionLayer) { regionLayer.remove(); regionLayer = null; }
    $("legend").classList.add("hidden");
    if (fly) map.flyTo([30, 10], innerWidth > 800 ? 2.5 : 1.5, { duration: 0.8 });
    return drawAdsb();
  }
  const byId = Object.fromEntries(GRIDS.map((g) => [g.id, g]));
  drawRegions(() => "win", (id) => (untracked(id) ? css("--region-other") : covColor(covFrac(byId[id]))));
  const most = Math.max(...GRIDS.map((g) => g.covered_s || 0));
  $("legend").innerHTML = `<div style="font-weight:600">History stored</div>
    <div class="ramp" style="background:linear-gradient(90deg,${[0, .25, .5, .75, 1].map(covColor).join(",")})"></div>
    <div class="ramp-k"><span>1 day</span><span>${esc(covText(most))}</span></div>
    <div style="margin-top:6px"><span style="background:${css("--region-other")}"></span>No public data</div>`;
  $("legend").classList.remove("hidden");
  if (fly) map.flyTo([30, 10], innerWidth > 800 ? 2.5 : 1.5, { duration: 0.8 });
}

// ---------------------------------------------------------------- aircraft-history overlay
// A separate layer (own pane, above the grids, below tooltips): aircraft-minutes stored per
// 0.5 deg cell, red (little) .. green (the best-covered cell), on a log scale.
let ADSB = null, adsbReq = null;
map.createPane("adsb").style.zIndex = 450;
const adsbRenderer = L.canvas({ pane: "adsb", padding: 0.3 });
// Data page tabs: grid history and aircraft history get the map to themselves.
let DATA_TAB = "grids";
try { if (localStorage.getItem("data-tab") === "aircraft") DATA_TAB = "aircraft"; } catch {}
function setDataTab(t) {
  DATA_TAB = t;
  try { localStorage.setItem("data-tab", t); } catch {}
  for (const b of $("data-tabs").querySelectorAll("button")) b.classList.toggle("on", b.dataset.tab === t);
  $("data-grids").style.display = t === "grids" ? "contents" : "none";
  $("data-air").classList.toggle("hidden", t !== "aircraft");
  $("data-sum").classList.toggle("hidden", t !== "grids");
  $("adsb-sum").classList.toggle("hidden", t !== "aircraft");
  if (!$("v-data").classList.contains("hidden")) showCoverage();
}
$("data-tabs").addEventListener("click", (ev) => { const b = ev.target.closest("button[data-tab]"); if (b && b.dataset.tab !== DATA_TAB) setDataTab(b.dataset.tab); });
setDataTab(DATA_TAB);
const adsbLoad = () => adsbReq || (adsbReq = fetch("api/adsb-coverage").then((r) => r.json()).then((j) => {
  ADSB = j;
  $("adsb-sum").textContent = j.days.length ? `Aircraft history · ${j.days.length} day${j.days.length > 1 ? "s" : ""} stored · ${j.days[0]}${j.days.length > 1 ? " … " + j.days[j.days.length - 1] : ""}` : "no ADS-B days stored";
  renderAdsbGantt(j);
  return j;
}).catch(() => { adsbReq = null; $("adsb-sum").textContent = "unavailable"; return null; }));
adsbLoad();
// "Fetch the latest data": every one of the last 7 UTC days not stored yet, fetched from
// ADSB.lol (~4 GB read, a few minutes per day) as one server job. Its id survives a reload.
const ADSB_JOB_KEY = "geoloc-adsb-job";
let ADSB_FETCH = null;  // {state: running|done|error, t0, text}
function renderAdsbFetch() {
  const box = $("adsb-fetch"), f = ADSB_FETCH;
  if (f?.state === "running") {
    const s = Math.round((Date.now() - f.t0) / 1000);
    box.innerHTML = `<div class="fetch-card"><div class="top"><b>Fetching aircraft history</b><span>${s < 120 ? s + " s" : Math.round(s / 60) + " min"}</span></div>
      <div class="pbar"><i style="width:100%"></i></div><div class="sub">${esc(f.text || "Reading ADSB.lol's daily releases, a few minutes per missing day")}</div></div>`;
    return;
  }
  if (f) {
    box.innerHTML = `<div class="fetch-card ${f.state === "done" ? "ok" : ""}"><div class="top"><b>${f.state === "done" ? "Up to date" : "Fetch failed"}</b></div>
      <div class="pbar"><i style="width:100%"></i></div><div class="sub" title="${esc(f.text)}">${esc(f.text)}</div></div>`;
    return;
  }
  box.innerHTML = `<button class="go" id="adsb-go"><span class="ic">${icon("download")}</span>
    <div><b>Fetch the latest data</b><span>Download the last 7 days ADSB.lol published that are not stored yet</span></div></button>`;
}
function adsbSummary(days) {
  const n = (st) => days.filter((d) => d.state === st).length;
  const unpublished = (d) => d.state === "error" && /no ADSB\.lol release/.test(d.error || "");
  const got = n("fetched"), err = days.filter((d) => d.state === "error" && !unpublished(d)), later = days.filter(unpublished);
  const parts = [got ? `${got} day${got === 1 ? "" : "s"} fetched` : "nothing new to fetch", n("stored") + n("in bucket") ? `${n("stored") + n("in bucket")} already stored` : "",

  const tick = () => {
    const s = (performance.now() - t0) / 1000;
    $("busy-time").textContent = s < 60 ? `${Math.floor(s)} s` : `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, "0")}`;
    $("busy-stage").textContent = STAGES[Math.min(STAGES.length - 1, Math.floor(s / 6))] + "…";
  };
  tick();
  const timer = setInterval(tick, 500);
  location.hash = "#/";
  route();
  try {
    // The upload starts a job; its result is polled, so no request stays open for
    // the whole analysis (proxies cut long ones).
    let r = await fetch("api/locate", { method: "POST", body: fd, signal: BUSY.signal });
    let rep = await readJson(r);
    if (!r.ok) throw new Error(rep.error || r.statusText);
    JOB = rep.job || null;
    let misses = 0;
    while (JOB) {
      await sleep(2000, BUSY.signal);
      try {
        r = await fetch(`api/locate/${JOB}`, { signal: BUSY.signal });
      } catch (e) {
        if (e.name === "AbortError" || ++misses > 15) throw e;  // ride out brief network drops
        continue;
      }
      rep = await readJson(r);
      if (r.ok && ["queued", "running", "cancelling"].includes(rep.state)) { misses = 0; continue; }
      JOB = null;
      if (!r.ok) throw new Error(rep.error || r.statusText);
    }
    rep.elapsed_s = (performance.now() - t0) / 1000;
    REPORT = rep;
    RESULT_SEEN = false;
    if (rep.grids) { GRIDS = rep.grids; fillRange(); }
    BUSY = null;
    renderResult();
    location.hash = "#/result";
  } catch (e) {
    BUSY = null;
    JOB = null;
    if (e.name !== "AbortError") {
      $("upload-err").innerHTML = `${icon("warn")}<span>${esc(e.message)}</span>`;
      $("upload-err").classList.remove("hidden");
    }
    route();
  } finally {
    clearInterval(timer);
  }
}

// ---------------------------------------------------------------- step 3: result
const LEVELS = {
  strong:   ["--good", "STRONG", 1, "Confident match"],
  moderate: ["--warning", "LIKELY", 0.68, "Probable match"],
  weak:     ["--serious", "WEAK", 0.36, "Tentative: a lead, not a finding"],
  none:     ["--critical", "NONE", 0.06, "No reliable match"],
};
const lvl = (v) => LEVELS[v?.level] || LEVELS.none;
const fmtDur = (s) => s >= 3600 ? `${(s / 3600).toFixed(1)} h` : s >= 60 ? `${Math.floor(s / 60)}:${String(Math.round(s % 60)).padStart(2, "0")}` : `${s.toFixed(0)} s`;
const fx = (n, d) => (n == null ? "–" : n.toFixed(d));
const gridName = (id) => GRIDS.find((g) => g.id === id)?.name || id;
const MONTHS = ["JAN", "FEB", "MAR", "APR", "MAY", "JUN", "JUL", "AUG", "SEP", "OCT", "NOV", "DEC"];
const flag = (cc) => cc.length === 2 ? String.fromCodePoint(...[...cc.toUpperCase()].map((c) => 0x1f1a5 + c.charCodeAt(0))) : "";

function ring(level) {
  const [col, label, frac] = LEVELS[level] || LEVELS.none;
  const C = 2 * Math.PI * 32;
  return `<svg viewBox="0 0 74 74"><circle class="track" cx="37" cy="37" r="32"/>
    <circle class="val" cx="37" cy="37" r="32" stroke="var(${col})" stroke-dasharray="${C}" stroke-dashoffset="${C}" data-to="${C * (1 - frac)}"/></svg>
    <span style="color:var(${col})">${label}</span>`;
}
function calendar(cand, label) {
  if (!cand) return "";
  const m = cand.start_iso.match(/(\d{4})-(\d\d)-(\d\d) (\d\d:\d\d):(\d\d)/);
  if (!m) return "";
  const wd = new Date(Date.UTC(+m[1], +m[2] - 1, +m[3])).toLocaleDateString("en", { weekday: "long", timeZone: "UTC" });
  return `<div class="page"><b>${MONTHS[+m[2] - 1]}</b><span>${+m[3]}</span></div>
    <div><div class="clock">${m[4]}<span style="color:var(--text-muted)">:${m[5]}</span><small>UTC</small></div>
    <div class="sub">${wd}, ${m[1]} · ${esc(label)}</div></div>`;
}

let TAB = "match", CLIP = 0, RESULT_SEEN = false;
function renderResult() {
  const rep = REPORT, v = rep.verdict || { level: "none" }, air = airBest();
  const g = GRIDS.find((x) => x.id === v.grid);

  $("where").style.color = v.grid || air ? "" : "var(--text-secondary)";

// Match tab: how each grid scored, and how far the winner's best offset stands above its runners-up.
function tabMatch() {
  const rep = REPORT, v = rep.verdict || {};
  const res = (rep.grid_results || []).filter((r) => r.candidates?.length || r.note);
  if (!res.length) return `<p style="color:var(--text-muted)">${esc((v.reasons || ["Nothing to match against."])[0])}</p>`;
  const top = Math.max(1e-9, ...res.map((r) => r.candidates?.[0]?.score ?? 0));
  const rows = [...res].sort((a, b) => (b.candidates?.[0]?.score ?? -1e9) - (a.candidates?.[0]?.score ?? -1e9)).map((r) => {
    const b = r.candidates?.[0];
    const w = b ? Math.max(2, (Math.max(0, b.score) / top) * 100) : 0;
    const tip = b ? `score ${fx(b.score, 1)} · r ${fx(b.r, 3)} · ${b.start_iso}` : r.note;
    return `<div class="row ${r.grid === v.grid ? "win" : ""} ${b ? "" : "empty"}" title="${esc(tip)}">
      <div class="name">${esc(gridName(r.grid))}</div><div class="track"><div class="fill" data-w="${w}%"></div></div></div>`;
  }).join("");
  const win = res.find((r) => r.grid === v.grid) || res.find((r) => r.candidates?.length);
  return `<h3>Grid fit</h3><div class="bars">${rows}</div>
    ${win?.candidates?.length > 1 ? `<h3>Best moment vs. runners-up · ${esc(gridName(win.grid))}</h3><div class="chart" id="lolli"></div>` : ""}
    ${v.reasons?.length ? `<details class="more"><summary>${icon("chev")}Why</summary><ul class="notes">${v.reasons.map((r) => `<li class="ok">${icon("info")}<span>${esc(r)}</span></li>`).join("")}</ul></details>` : ""}`;
}
function drawLollipop() {
  const box = $("lolli"); if (!box) return;
  const v = REPORT.verdict || {};
  const win = (REPORT.grid_results || []).find((r) => r.grid === v.grid) || (REPORT.grid_results || []).find((r) => r.candidates?.length);
  const cs = win.candidates.filter((c) => c.score != null);
  const W = box.clientWidth || 380, H = 120, m = { l: 6, r: 6, t: 10, b: 18 };
  const hi = Math.max(...cs.map((c) => c.score)), lo = Math.min(0, ...cs.map((c) => c.score));
  const bw = (W - m.l - m.r) / cs.length;
  const y = (s) => m.t + (1 - (s - lo) / (hi - lo || 1)) * (H - m.t - m.b);
  box.innerHTML = `<svg viewBox="0 0 ${W} ${H}" height="${H}">${cs.map((c, i) => {
    const x = m.l + bw * (i + 0.5), cls = i === 0 && v.grid ? "win" : "";
    return `<g><title>#${i + 1} · ${c.start_iso} · score ${fx(c.score, 1)}</title>
      <line class="stem ${cls}" x1="${x}" x2="${x}" y1="${y(lo)}" y2="${y(c.score)}"/><circle class="head ${cls}" cx="${x}" cy="${y(c.score)}" r="${i ? 4 : 6}"/>
      <text x="${x}" y="${H - 4}" text-anchor="middle">${i + 1}</text></g>`;
  }).join("")}</svg>`;
}

// Signal tab: the hum itself.
function tabSignal() {
  const rep = REPORT, hum = rep.hum || {}, enf = traceOf(rep);
  const harm = (hum.harmonics || []).filter((h) => h.nominal === hum.nominal_hz).sort((a, b) => a.centre_hz - b.centre_hz);
  const maxDb = Math.max(1, ...harm.map((h) => h.snr_db));
  const valid = rep.enf?.valid_fraction ?? (enf ? enf.freq_hz.filter((f) => f != null).length / enf.freq_hz.length : 0);
  const c = rep.verdict?.candidate;
  const donut = (frac, col) => { const C = 2 * Math.PI * 20; return `<svg class="donut" viewBox="0 0 52 52" style="transform:rotate(-90deg)"><circle cx="26" cy="26" r="20" stroke="var(--border)"/><circle cx="26" cy="26" r="20" stroke="var(${col})" stroke-linecap="round" stroke-dasharray="${C * Math.max(0.01, Math.min(1, frac))} ${C}"/></svg>`; };
  const ppm = c?.offset_hz != null ? Math.abs(c.offset_hz / (hum.nominal_hz || 50) * 1e6) : null;
  return `<div class="meters">
      <div class="meter" title="Mains frequency heard in the recording">${donut(hum.nominal_hz ? 1 : 0, "--series-1")}<div class="v">${hum.nominal_hz ? hum.nominal_hz + " Hz" : "—"}</div><div class="k">mains</div></div>
      <div class="meter" title="Share of the recording where the hum could be traced">${donut(valid, valid > 0.6 ? "--good" : valid > 0.3 ? "--warning" : "--critical")}<div class="v">${Math.round(valid * 100)}%</div><div class="k">traceable</div></div>
      <div class="meter" title="Recorder clock error implied by the matched reference">${donut(ppm == null ? 0 : Math.min(1, ppm / 200), "--text-muted")}<div class="v">${ppm == null ? "—" : Math.round(ppm) + " ppm"}</div><div class="k">clock drift</div></div>
    </div>
    ${enf ? `<h3>Hum frequency over time</h3><div class="chart" id="trace"></div>` : ""}
    ${harm.length ? `<h3>Harmonic strength</h3><div class="bars">${harm.map((h) => `<div class="row ${h.snr_db === maxDb ? "win" : ""}" title="${Math.round(h.centre_hz)} Hz · ${h.snr_db.toFixed(1)} dB above noise">
      <div class="name">${Math.round(h.centre_hz)} Hz</div><div class="track"><div class="fill" data-w="${Math.max(2, (Math.max(0, h.snr_db) / maxDb) * 100)}%"></div></div></div>`).join("")}</div>` : ""}`;
}
// An edited file has no single trace: join the segments' traces.
function traceOf(rep) {
  if (rep.enf) return rep.enf;
  const parts = (rep.segments || []).filter((sg) => sg.enf);
  return parts.length ? { times_s: parts.flatMap((sg) => sg.enf.times_s), freq_hz: parts.flatMap((sg) => sg.enf.freq_hz) } : null;
}
function drawTrace() {
  const box = $("trace"); if (!box) return;
  const enf = traceOf(REPORT), cuts = (REPORT.cuts || []).map((c) => c.time_s);
  const pts = enf.times_s.map((t, i) => [t, enf.freq_hz[i]]).filter(([, f]) => f != null);
  if (pts.length < 2) { box.innerHTML = `<p style="color:var(--text-muted)">Too few usable frames to plot.</p>`; return; }
  const W = box.clientWidth || 380, H = 150, m = { l: 30, r: 4, t: 8, b: 18 };
  const mean = pts.reduce((a, p) => a + p[1], 0) / pts.length;
  const dev = pts.map(([t, f]) => [t, (f - mean) * 1000]);  // mHz around the clip's mean
  const t1 = Math.max(dev[dev.length - 1][0], ...cuts);
  let lo = Math.min(...dev.map((d) => d[1])), hi = Math.max(...dev.map((d) => d[1]));
  const pad = (hi - lo) * 0.1 || 1; lo -= pad; hi += pad;
  const x = (t) => m.l + (t / t1) * (W - m.l - m.r);
  const y = (v) => m.t + (1 - (v - lo) / (hi - lo)) * (H - m.t - m.b);
  const dt = (t1 / (enf.times_s.length - 1 || 1)) * 2.5;  // break the line across unusable frames
  let d = "";
  dev.forEach(([t, v], i) => { d += `${i && t - dev[i - 1][0] <= dt ? "L" : "M"}${x(t).toFixed(1)},${y(v).toFixed(1)}`; });
  const raw = (hi - lo) / 4, mag = 10 ** Math.floor(Math.log10(raw));
  const step = [1, 2, 5, 10].map((k) => k * mag).find((k) => k >= raw);
  const ticks = [];
  for (let v = Math.ceil(lo / step) * step; v <= hi; v += step) ticks.push(v);
  box.innerHTML = `<svg viewBox="0 0 ${W} ${H}" height="${H}" aria-label="Hum frequency deviation over the recording">
      <g class="gl">${ticks.map((v) => `<line x1="${m.l}" x2="${W - m.r}" y1="${y(v)}" y2="${y(v)}"/>`).join("")}</g>
      ${ticks.map((v) => `<text x="${m.l - 4}" y="${y(v) + 3}" text-anchor="end">${v > 0 ? "+" : ""}${Math.round(v) || 0}</text>`).join("")}
      <text x="${m.l}" y="${H - 4}">0:00</text><text x="${W - m.r}" y="${H - 4}" text-anchor="end">${fmtDur(t1)}</text>
      <text x="${(m.l + W - m.r) / 2}" y="${H - 4}" text-anchor="middle">mHz around ${mean.toFixed(3)} Hz</text>
      ${cuts.map((t) => `<line class="cut" x1="${x(t)}" x2="${x(t)}" y1="${m.t}" y2="${H - m.b}"><title>edit point at ${fmtDur(t)}</title></line>`).join("")}
      <path class="line" d="${d}"/>
      <line class="cross" y1="${m.t}" y2="${H - m.b}" style="display:none"/><circle class="dot" r="4" style="display:none"/>
      <rect x="${m.l}" y="0" width="${W - m.l - m.r}" height="${H}" fill="transparent"/></svg><div class="tip"></div>`;
  const svg = box.querySelector("svg"), cross = svg.querySelector(".cross"), dot = svg.querySelector(".dot"), tip = box.querySelector(".tip");
  svg.addEventListener("mousemove", (ev) => {
    const r = svg.getBoundingClientRect();
    const t = ((ev.clientX - r.left) * (W / r.width) - m.l) / (W - m.l - m.r) * t1;
    let best = dev[0];
    for (const p of dev) if (Math.abs(p[0] - t) < Math.abs(best[0] - t)) best = p;
    const px = x(best[0]), py = y(best[1]);
    cross.setAttribute("x1", px); cross.setAttribute("x2", px); cross.style.display = "";
    dot.setAttribute("cx", px); dot.setAttribute("cy", py); dot.style.display = "";
    tip.style.display = "block";
    tip.innerHTML = `${fmtDur(best[0])} · <b>${(mean + best[1] / 1000).toFixed(4)} Hz</b>`;
    tip.style.left = Math.min(px * (r.width / W) + 8, r.width - tip.offsetWidth) + "px";
    tip.style.top = "-6px";
  });
  svg.addEventListener("mouseleave", () => { cross.style.display = dot.style.display = tip.style.display = "none"; });
}

// Clips tab: the file's timeline cut at its edit points, each clip coloured by how well it matched.

// File tab: what the file itself says, plus checks.
function tabFile() {
  const rep = REPORT, fc = rep.file_clues || {};
  const tiles = [
    ["file", rep.path, rep.size_bytes ? `${(rep.size_bytes / 1048576).toFixed(1)} MB` : "file", true],
    ["clock", rep.duration_s != null ? fmtDur(rep.duration_s) : null, "duration"],

  ].filter(([, x]) => x != null && x !== "");

  const tzItems = [...(tz.notes || []).map((n) => ["info", n]),
    ...(tz.evidence || []).map((e) => [e.used ? "check" : "info", `${e.key} = ${e.raw}: ${e.note}`])];
  return `<div class="tiles">${tiles.map(([ic, val, k, wide]) => `<div class="tile ${wide ? "wide" : ""}" title="${esc(val)}">${icon(ic)}<div><b>${esc(val)}</b><span>${esc(k)}</span></div></div>`).join("")}</div>
    ${tzItems.length ? `<h3>Time zone</h3><ul class="notes">${tzItems.map(([ic, n]) => `<li class="ok">${icon(ic)}<span>${esc(n)}</span></li>`).join("")}</ul>` : ""}
    ${notes.length ? `<h3>Checks</h3><ul class="notes">${notes.map(([c, n]) => `<li class="${c}">${icon(c ? "check" : "warn")}<span>${esc(n)}</span></li>`).join("")}</ul>` : ""}`;
}

// How likely each grid is, 0..1: its best score against the top grid's, damped by how sure the verdict is.
function likelihoods(src) {
  const best = {};
  const add = (rs) => (rs || []).forEach((r) => { const sc = r.candidates?.[0]?.score; if (sc != null) best[r.grid] = Math.max(best[r.grid] ?? -Infinity, sc); });
  add(src.grid_results);
  if (!Object.keys(best).length) (src.segments || []).forEach((sg) => add(sg.grid_results));
  const top = Math.max(1e-9, ...Object.values(best)), sure = lvl(src.verdict)[2];
  const out = Object.fromEntries((src.candidate_regions || []).map((r) => [r.grid, 0]));
  for (const [g, sc] of Object.entries(best)) out[g] = (Math.max(0, sc) / top) ** 2 * Math.max(0.25, sure);
  return out;
}
const rgb = (h) => [0, 2, 4].map((i) => parseInt(h.replace("#", "").slice(i, i + 2), 16));
const mix = (a, b, t) => { const A = rgb(a), B = rgb(b); return `rgb(${A.map((x, i) => Math.round(x + (B[i] - x) * t)).join(",")})`; };
const likeColor = (t) => mix(css("--land"), css("--series-1"), 0.15 + 0.85 * t);
const likeWord = (t) => t > 0.75 ? "most likely" : t > 0.4 ? "plausible" : t > 0.1 ? "unlikely" : "possible, weak fit";

function showResultMap(src = REPORT) {
  if (!REPORT) return;
  const v = src.verdict || {}, fc = REPORT.file_clues || {};
  const like = likelihoods(src);
  // Grids as they were at the matched time (the Baltic states were on IPS/UPS before 2025-02-09).
  const day = v.candidate?.start_iso ? v.candidate.start_iso.slice(0, 10) : today();
  const bounds = drawRegions((id) => (id in like ? (id === v.grid ? "win" : "other") : null),
    (id) => (untracked(id) ? css("--region-other") : likeColor(like[id])),
    (id) => (untracked(id) ? "no public reference data: cannot be matched" : `${esc(likeWord(like[id]))} · ${Math.round(like[id] * 100)}%`), day);
  // Frame the winner plus any runner-up that is still a serious contender (or everything, when nothing won).
  const top = Math.max(0, ...Object.values(like));
  for (const id in like) if (!untracked(id) && (!v.grid || like[id] >= 0.3 * top)) AREAS.filter((f) => fid(f) === id && activeOn(f, day)).forEach((f) => bounds.extend(L.geoJSON(f).getBounds()));
  clearMarks();
  let extra = "";
  if (fc.gps) {
    pin = L.circleMarker(fc.gps, { radius: 7, color: css("--surface-1"), weight: 2, fillColor: css("--text-primary"), fillOpacity: 1 })
      .bindTooltip("GPS from file metadata").addTo(map);
    extra = `<div style="margin-top:4px"><span style="background:${css("--text-primary")}"></span>Metadata GPS</div>`;
  }
  $("legend").innerHTML = Object.keys(like).length ? `<div style="font-weight:600">Likelihood${v.grid ? ` · ${esc(gridName(v.grid))}` : ""}</div>
    <div class="ramp" style="background:linear-gradient(90deg,${[0, .25, .5, .75, 1].map(likeColor).join(",")})"></div>
    <div class="ramp-k"><span>possible</span><span>most likely</span></div>
    <div style="margin-top:4px"><span style="background:${css("--region-other")}"></span>No reference data</div>${v.candidate?.start_iso ? `<div style="opacity:.75;margin-top:4px">Grid areas as of ${esc(day)}</div>` : ""}${extra}` : extra;
  $("legend").classList.toggle("hidden", !$("legend").innerHTML);
  const airBounds = src === REPORT ? drawAircraft() : null;
  if (airBounds) map.flyToBounds(airBounds, { ...fitPad(), maxZoom: 12, duration: 0.9 });
  else if (pin && !Object.keys(like).length) map.flyTo(fc.gps, 5, { duration: 0.9 });
  else frame(bounds);
  if (!airBounds) drawTimeZone();
}

// What the device clock's UTC offset leaves of the grid: drawn over it, and framed.
let tzDraws = 0;  // the latest call wins: the map can be redrawn before the areas arrive
function drawTimeZone() {
  const tz = REPORT?.timezone, my = ++tzDraws;
  if (!tz?.zones?.length) return;
  const keep = new Set(tz.zones.map((z) => z.tz)), day = tz.day || today();
  tzAreas().then((feats) => {
    if (my !== tzDraws || $("v-result").classList.contains("hidden")) return;
    if (tzLayer) tzLayer.remove();
    const b = L.latLngBounds([]);
    tzLayer = L.geoJSON(feats, {
      filter: (f) => keep.has(f.properties.tz) && (!tz.grid || f.properties.grid === tz.grid) && activeOn(f, day),
      style: { color: css("--text-primary"), weight: 1.2, dashArray: "4 3", fillColor: css("--warning"), fillOpacity: 0.55 },
      onEachFeature: (f, layer) => {
        b.extend(layer.getBounds());
        const p = f.properties, subs = p.subdivisions?.length ? ` (${p.subdivisions.join(", ")})` : "";
        layer.bindTooltip(`<b>${esc(tz.offsets.join(" / "))}</b> on ${esc(day)}<br>${esc(p.tz)}<br>${esc(p.countries.join(", "))}${esc(subs)}`, { sticky: true });
      },
    }).addTo(map);
    $("tz-legend")?.remove();
    $("legend").insertAdjacentHTML("beforeend", `<div id="tz-legend" style="margin-top:4px"><span style="background:${css("--warning")}"></span>Device clock ${esc(tz.offsets.join(" / "))}</div>`);
    $("legend").classList.remove("hidden");
    frame(b);
  });
}

// ---------------------------------------------------------------- aircraft
// Search area for the aircraft when the hum gives no grid: the map's view when chosen.
let AIR_AREA = null;
function showAirArea() {
  $("air-area").textContent = AIR_AREA ? AIR_AREA.map((x) => x.toFixed(2)).join(", ") : "from the hum";
  $("air-clear").classList.toggle("hidden", !AIR_AREA);
}
$("air-use").addEventListener("click", () => {
  const b = map.getBounds();
  AIR_AREA = [b.getWest(), b.getSouth(), b.getEast(), b.getNorth()].map((x, i) => Math.max(i % 2 ? -90 : -180, Math.min(i % 2 ? 90 : 180, x)));
  showAirArea();
});
$("air-clear").addEventListener("click", () => { AIR_AREA = null; showAirArea(); });

const FLIGHT_COLORS = ["#f2711c", "#a23bd0", "#13a89e", "#e03e8c", "#7a8b00"];
const latlon = (a, b) => `${Math.abs(a).toFixed(4)}° ${a >= 0 ? "N" : "S"}, ${Math.abs(b).toFixed(4)}° ${b >= 0 ? "E" : "W"}`;
const mmss = (s) => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, "0")}`;
const utcOf = (epoch) => epoch == null ? "" : new Date(epoch * 1000).toISOString().slice(11, 19) + " UTC";
// The best aircraft answer: {level, lat, lon, start_utc, result, hypothesis}.
function airBest() {
  const a = REPORT?.aircraft, b = a?.best;
  if (!b) return null;
  const h = a.hypotheses[b.hypothesis];
  return { ...b, label: h?.label, result: h?.result };
}
const AIR_LEVEL = { strong: "--good", moderate: "--warning", weak: "--serious", none: "--critical" };
function flightTitle(f) { return `${f.registration || f.flight.toUpperCase()}${f.type ? " · " + f.type : ""}`; }
function flightPopup(f, color) {
  const day = (f.cpa_utc || "").slice(0, 10);
  const ft = (m) => m == null ? "–" : `${Math.round(m / 0.3048).toLocaleString("en")} ft (${Math.round(m).toLocaleString("en")} m)`;
  const rows = [
    ["Aircraft", [f.description, f.year && `built ${f.year}`].filter(Boolean).join(", ") || f.type || "unknown type"],
    ["Class", [f.engines ? `${f.engines} ×` : "", f.engine, f.kind].filter(Boolean).join(" ")],
    ["Operator", f.owner],
    ["ICAO address", f.flight.toUpperCase()],
    ["Closest approach", `${utcOf(f.cpa_epoch)} · ${(f.cpa_m / 1000).toFixed(2)} km slant`],
    ["Altitude then", ft(f.cpa_alt_m)],
    ["Speed", `${Math.round(f.speed_ms / 0.514444)} kt (${Math.round(f.speed_ms)} m/s)`],
    ["Heading", f.cpa_track_deg == null ? "–" : `${Math.round(f.cpa_track_deg)}°`],
    ["Tone heard", `${f.f0_hz.toFixed(1)} Hz at rest · fit ${f.fit.toFixed(2)}`],
  ].filter(([, v]) => v);
  return `<div class="air-pop"><h4 style="color:${color}">${esc(flightTitle(f))}</h4><div class="sub">flyover ${f.event + 1} in the recording</div>
    <table>${rows.map(([k, v]) => `<tr><td>${esc(k)}</td><td>${esc(v)}</td></tr>`).join("")}</table>
    <div style="margin-top:6px"><a href="https://globe.adsb.lol/?icao=${esc(f.flight)}&showTrace=${esc(day)}" target="_blank" rel="noopener">Track on adsb.lol ↗</a></div></div>`;
}
const planeSvg = (color, deg) => `<svg viewBox="0 0 24 24" style="transform:rotate(${deg || 0}deg)"><path fill="${color}" stroke="#fff" stroke-width="1.1" d="${ICON.plane.match(/d="([^"]+)"/)[1]}"/></svg>`;

let AIR_MARKS = [];  // per flight: {line, plane, ray}
function drawAircraft() {
  if (airLayer) { airLayer.remove(); airLayer = null; }
  if (adsbLayer) { adsbLayer.remove(); adsbLayer = null; }
  AIR_MARKS = [];
  const a = REPORT?.aircraft, best = airBest();
  if (!a || !best) return null;
  airLayer = L.layerGroup().addTo(map);
  const b = L.latLngBounds([[best.lat, best.lon]]);
  // Runners-up: other places that matched other aircraft.
  (best.result?.candidates || []).slice(1, 8).forEach((c, i) => {
    L.circleMarker([c.lat, c.lon], { radius: 5, color: css("--surface-1"), weight: 1.5, fillColor: css("--text-muted"), fillOpacity: 0.85 })
      .bindTooltip(`Runner-up #${i + 2} · score ${c.score.toFixed(1)} vs ${best.result.candidates[0].score.toFixed(1)}<br>${esc(c.matches.map((m) => `${m.registration || m.flight} ${m.type}`).join(" + "))}<br>start ${esc(c.start_utc)}`)
      .addTo(airLayer);
  });
  a.flights.forEach((f, i) => {
    const color = FLIGHT_COLORS[i % FLIGHT_COLORS.length], tip = `<b>${esc(flightTitle(f))}</b><br>${esc(f.description || "")}<br>${(f.cpa_m / 1000).toFixed(1)} km away at ${utcOf(f.cpa_epoch)}`;
    const pts = f.track.map((p) => [p[1], p[2]]);
    const line = pts.length > 1 ? L.polyline(pts, { color, weight: 3, opacity: 0.85 }).bindTooltip(tip, { sticky: true }).bindPopup(flightPopup(f, color)).addTo(airLayer) : null;
    pts.forEach((p) => b.extend(p));
    let plane = null, ray = null;
    if (f.cpa_lat != null) {
      plane = L.marker([f.cpa_lat, f.cpa_lon], { icon: L.divIcon({ className: "plane-ic", html: planeSvg(color, f.cpa_track_deg), iconSize: [30, 30], iconAnchor: [15, 15] }), zIndexOffset: 500 })
        .bindTooltip(tip).bindPopup(flightPopup(f, color)).addTo(airLayer);
      ray = L.polyline([[f.cpa_lat, f.cpa_lon], [best.lat, best.lon]], { color, weight: 1.5, dashArray: "4 4", opacity: 0.9 })
        .bindTooltip(`${(f.cpa_m / 1000).toFixed(2)} km slant · heard ${utcOf(f.cpa_epoch)}`, { sticky: true }).addTo(airLayer);
      b.extend([f.cpa_lat, f.cpa_lon]);
    }
    for (const layer of [line, plane, ray]) layer?.on("mouseover", () => hotFlight(i, true)).on("mouseout", () => hotFlight(i, false));
    AIR_MARKS.push({ line, plane, ray });
  });
  const listener = L.marker([best.lat, best.lon], { icon: L.divIcon({ className: "", html: '<div class="listener-ic"></div>', iconSize: [18, 18], iconAnchor: [9, 9] }), zIndexOffset: 1000 })
    .bindTooltip(`<b>Recording made here</b><br>${esc(latlon(best.lat, best.lon))}<br>${esc(best.level)} · starts ${esc(best.start_utc)}`).addTo(airLayer);
  $("legend").insertAdjacentHTML("beforeend", `<div style="margin-top:4px"><span style="background:${css("--critical")}"></span>Recording (aircraft)</div>`
    + a.flights.map((f, i) => `<div><span style="background:${FLIGHT_COLORS[i % FLIGHT_COLORS.length]}"></span>${esc(flightTitle(f))}</div>`).join(""));
  $("legend").classList.remove("hidden");
  return b.pad(0.08);
}
function hotFlight(i, on) {
  const m = AIR_MARKS[i]; if (!m) return;
  m.line?.setStyle({ weight: on ? 6 : 3, opacity: on ? 1 : 0.85 });
  if (on) m.line?.bringToFront();
  document.querySelectorAll(`.flight[data-f="${i}"]`).forEach((el) => el.classList.toggle("hot", on));
}

function tabAir() {
  const a = REPORT.aircraft, best = airBest();
  const ev = a.events || [];
  const notes = [...(a.notes || []), ...a.hypotheses.map((h, i) => `${i === best?.hypothesis ? "★ " : ""}${h.label}: ${h.result ? (h.result.candidates?.length ? `${h.result.level}, ${h.result.reasons?.[0] || ""}` : "no matching place") : h.note || ""}`)];
  const head = best ? `<div class="air-sum"><span class="lvl" style="background:var(${AIR_LEVEL[best.level] || "--critical"})">${esc(best.level.toUpperCase())}</span>
      <div><b>${esc(latlon(best.lat, best.lon))}</b><span>starts ${esc(best.start_utc)} · time from ${esc(best.label || "")}</span></div></div>`
    : `<p style="color:var(--text-muted)">${ev.length ? `${ev.length} flyover(s) heard, no aircraft matched${a.notes?.length ? ": " + esc(a.notes[0]) : "."}` : "No aircraft flyover heard."}</p>`;
  const cards = (a.flights || []).map((f, i) => `<div class="flight" data-f="${i}" style="--fc:${FLIGHT_COLORS[i % FLIGHT_COLORS.length]}">
      <div class="plane">${icon("plane")}</div>
      <div style="min-width:0"><b>${esc(flightTitle(f))}</b><div class="sub">${esc([f.description, f.owner].filter(Boolean).join(" · ") || "unknown aircraft")}</div></div>
      <div class="num">${(f.cpa_m / 1000).toFixed(1)} km<br>${f.cpa_alt_m == null ? "" : Math.round(f.cpa_alt_m / 0.3048).toLocaleString("en") + " ft"}</div></div>`).join("");
  const matched = (a.spectra || []).filter((sp) => sp.matched), other = (a.spectra || []).filter((sp) => !sp.matched);
  const block = (sp) => {
    const e = ev[sp.event] || {}, fi = (a.flights || []).findIndex((f) => f.event === sp.event), f = a.flights?.[fi];
    return `<div class="spec-head"><b>Flyover ${sp.event + 1}${f ? " · " + esc(flightTitle(f)) : ""}</b>
      <span>${mmss(e.tc_s ?? 0)} in · ${fx(e.speed_ms, 0)} m/s · ${fx((e.cpa_m ?? 0) / 1000, 1)} km · ${fx(e.f0_hz, 1)} Hz</span></div>
      <div class="spec" data-spec="${sp.event}"><canvas></canvas><svg></svg><div class="tip"></div></div>`;
  };
  return `${head}
    ${cards ? `<h3>Aircraft heard</h3><div class="flights">${cards}</div>` : ""}
    ${matched.length ? `<h3>Doppler curves</h3><div class="spec-key"><span><i style="border-color:${FLIGHT_COLORS[0]};border-top-style:dashed"></i>from the track</span><span><i style="border-color:var(--text-muted);border-top-style:dotted"></i>straight fit</span><span style="margin-left:auto">click to hide</span></div>${matched.map(block).join("")}` : ""}
    ${other.length ? `<details class="more" ${matched.length ? "" : "open"}><summary>${icon("chev")}${matched.length ? "Other sounds heard, not matched to an aircraft" : "Flyovers heard"} · ${other.length}</summary>${other.map(block).join("")}</details>` : ""}
    ${notes.length ? `<details class="more"><summary>${icon("chev")}Searches</summary><ul class="notes">${notes.map((n) => `<li class="ok">${icon("info")}<span>${esc(n)}</span></li>`).join("")}</ul></details>` : ""}`;
}

// Whitened level 0..255 -> colour: black, deep blue, magenta, orange, pale yellow.
const SPEC_RAMP = [[0, 0, 4], [40, 11, 84], [140, 41, 129], [229, 92, 48], [252, 211, 92], [252, 255, 164]];
const SPEC_LUT = Array.from({ length: 256 }, (_, v) => {
  const x = (v / 255) * (SPEC_RAMP.length - 1), i = Math.min(SPEC_RAMP.length - 2, Math.floor(x)), t = x - i;
  return SPEC_RAMP[i].map((c, k) => Math.round(c + (SPEC_RAMP[i + 1][k] - c) * t));
});
function drawSpectra() {
  const a = REPORT.aircraft;
  document.querySelectorAll(".spec[data-spec]").forEach((box) => {
    const sp = a.spectra.find((x) => x.event === +box.dataset.spec);
    if (!sp || !sp.w) return;
    const cv = box.querySelector("canvas"), svg = box.querySelector("svg"), tip = box.querySelector(".tip");
    cv.width = sp.w; cv.height = sp.h;
    const bytes = Uint8Array.from(atob(sp.pixels), (c) => c.charCodeAt(0)), img = cv.getContext("2d").createImageData(sp.w, sp.h);
    for (let i = 0, d = img.data; i < bytes.length; i++) { const c = SPEC_LUT[bytes[i]]; d[4 * i] = c[0], d[4 * i + 1] = c[1], d[4 * i + 2] = c[2], d[4 * i + 3] = 255; }
    cv.getContext("2d").putImageData(img, 0, 0);
    const W = box.clientWidth || 380, H = 190;
    const x = (t) => ((t - sp.t0) / (sp.t1 - sp.t0)) * W, y = (f) => (1 - (f - sp.f_lo) / (sp.f_hi - sp.f_lo)) * H;
    const path = (pts) => pts.map(([t, f], i) => `${i ? "L" : "M"}${x(t).toFixed(1)},${y(f).toFixed(1)}`).join("");
    const fi = (a.flights || []).findIndex((f) => f.event === sp.event), color = FLIGHT_COLORS[Math.max(0, fi) % FLIGHT_COLORS.length];
    const fticks = []; const step = [10, 20, 25, 50, 100, 200].find((k) => (sp.f_hi - sp.f_lo) / k <= 5) || 200;
    for (let f = Math.ceil(sp.f_lo / step) * step; f < sp.f_hi; f += step) fticks.push(f);
    const tticks = []; const tstep = [5, 10, 15, 20, 30].find((k) => (sp.t1 - sp.t0) / k <= 6) || 30;
    for (let t = Math.ceil(sp.t0 / tstep) * tstep; t < sp.t1; t += tstep) tticks.push(t);
    svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
    svg.innerHTML = `${(sp.straight || []).map((c) => `<path class="straight" d="${path(c)}"/>`).join("")}
      ${(sp.model || []).map((c) => `<path class="model" stroke="${color}" d="${path(c)}"/>`).join("")}
      ${fticks.map((f) => `<text x="4" y="${y(f) + 3}">${f} Hz</text>`).join("")}
      ${tticks.map((t) => `<text x="${x(t)}" y="${H - 4}" text-anchor="middle">${mmss(t)}</text>`).join("")}
      <line class="cross" y1="0" y2="${H}" style="display:none"/>`;
    const cross = svg.querySelector(".cross"), start = a.start_epoch;
    box.onmousemove = (ev) => {
      const r = box.getBoundingClientRect(), px = ev.clientX - r.left, py = ev.clientY - r.top;
      const t = sp.t0 + (px / r.width) * (sp.t1 - sp.t0), f = sp.f_hi - (py / r.height) * (sp.f_hi - sp.f_lo);
      let model = "";
      if (sp.model?.[0]?.length) {
        const m = sp.model[0].reduce((p, q) => (Math.abs(q[0] - t) < Math.abs(p[0] - t) ? q : p));
        model = ` · model ${m[1].toFixed(1)} Hz`;
      }
      cross.setAttribute("x1", px * W / r.width); cross.setAttribute("x2", px * W / r.width); cross.style.display = "";
      tip.style.display = "block";
      tip.innerHTML = `${mmss(t)}${start != null ? ` · ${utcOf(start + t)}` : ""} · <b>${f.toFixed(1)} Hz</b>${model}`;
      tip.style.left = Math.max(0, Math.min(px + 8, r.width - tip.offsetWidth)) + "px";
      tip.style.top = "4px";
    };
    box.onmouseleave = () => { cross.style.display = tip.style.display = "none"; };
    box.onclick = () => box.classList.toggle("bare");  // the measured lines alone
  });
}
$("tab-body").addEventListener("mouseover", (ev) => { const c = ev.target.closest(".flight[data-f]"); if (c) hotFlight(+c.dataset.f, true); });
$("tab-body").addEventListener("mouseout", (ev) => { const c = ev.target.closest(".flight[data-f]"); if (c && !c.contains(ev.relatedTarget)) hotFlight(+c.dataset.f, false); });
$("tab-body").addEventListener("click", (ev) => {
  const c = ev.target.closest(".flight[data-f]"); if (!c) return;
  const m = AIR_MARKS[+c.dataset.f]; if (!m) return;
  const target = m.plane || m.line;
  if (!target) return;
  if (m.line) map.flyToBounds(m.line.getBounds().extend(m.plane ? m.plane.getLatLng() : m.line.getBounds()), { ...fitPad(), maxZoom: 12, duration: 0.7 });
  setTimeout(() => target.openPopup(), 750);
});
let resizing = null;
addEventListener("resize", () => {
  clearTimeout(resizing);
  resizing = setTimeout(() => { if (REPORT && !$("v-result").classList.contains("hidden")) renderTab(); }, 150);
});
loadGrids(true).then(() => pollRefresh());  // picks up refreshes still running from before a reload
</script>
</body>
</html>
